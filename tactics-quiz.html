<title>Tactics Board — Soccer Concepts Quiz</title>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
const RED = '#e63946';
const BLUE = '#457b9d';

function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

function makePlayer(layer, x, y, label, fill) {
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('transform', `translate(${x},${y})`);
  const jerseyFill = fill === BLUE ? 'url(#homeStripes)' : fill;
  const shirt = document.createElementNS(SVGNS, 'path');
  shirt.setAttribute('d', 'M -9,-9 L -4,-13 L 4,-13 L 9,-9 L 13,-2 L 8,2 L 8,13 L -8,13 L -8,2 L -13,-2 Z');
  shirt.setAttribute('fill', jerseyFill);
  shirt.setAttribute('stroke', '#0d1b14');
  shirt.setAttribute('stroke-width', '1.5');
  shirt.setAttribute('stroke-linejoin', 'round');
  const text = document.createElementNS(SVGNS, 'text');
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('dy', '4');
  text.setAttribute('font-size', '9');
  text.setAttribute('font-family', 'JetBrains Mono, monospace');
  text.setAttribute('fill', '#0d1b14');
  text.setAttribute('font-weight', 'bold');
  text.textContent = label;
  g.appendChild(shirt);
  g.appendChild(text);
  layer.appendChild(g);
  return g;
}

function makeBall(layer, x, y) {
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('transform', `translate(${x},${y})`);
  const base = document.createElementNS(SVGNS, 'circle');
  base.setAttribute('r', '6');
  base.setAttribute('fill', '#f7f7f2');
  base.setAttribute('stroke', '#0d1b14');
  base.setAttribute('stroke-width', '1');
  g.appendChild(base);
  const pentagon = document.createElementNS(SVGNS, 'polygon');
  const pentPts = [0, 1, 2, 3, 4].map(i => {
    const a = -Math.PI / 2 + i * (2 * Math.PI / 5);
    return `${(Math.cos(a) * 2.3).toFixed(2)},${(Math.sin(a) * 2.3).toFixed(2)}`;
  }).join(' ');
  pentagon.setAttribute('points', pentPts);
  pentagon.setAttribute('fill', '#0d1b14');
  g.appendChild(pentagon);
  [0, 72, 144, 216, 288].forEach(deg => {
    const line = document.createElementNS(SVGNS, 'line');
    const rad = deg * Math.PI / 180;
    line.setAttribute('x1', (Math.cos(rad) * 2.5).toFixed(2));
    line.setAttribute('y1', (Math.sin(rad) * 2.5).toFixed(2));
    line.setAttribute('x2', (Math.cos(rad) * 5.6).toFixed(2));
    line.setAttribute('y2', (Math.sin(rad) * 5.6).toFixed(2));
    line.setAttribute('stroke', '#0d1b14');
    line.setAttribute('stroke-width', '0.8');
    g.appendChild(line);
  });
  layer.appendChild(g);
  return g;
}

async function moveEl(el, x, y, duration) {
  return new Promise(resolve => {
    el.style.transition = `transform ${duration}ms ease`;
    requestAnimationFrame(() => el.setAttribute('transform', `translate(${x},${y})`));
    setTimeout(resolve, duration);
  });
}

async function moveBall(el, x, y, duration) {
  return new Promise(resolve => {
    el.style.transition = `transform ${duration}ms ease`;
    requestAnimationFrame(() => el.setAttribute('transform', `translate(${x},${y})`));
    setTimeout(resolve, duration);
  });
}

async function drawArrow(layer, x1, y1, x2, y2, duration, dashed) {
  const margin = 18;
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  let startMargin = margin, endMargin = margin;
  if (dist <= startMargin + endMargin + 10) {
    startMargin = dist * 0.25;
    endMargin = dist * 0.25;
  }
  const ux = dx / dist, uy = dy / dist;
  const sx = x1 + ux * startMargin, sy = y1 + uy * startMargin;
  const ex = x2 - ux * endMargin, ey = y2 - uy * endMargin;
  const path = document.createElementNS(SVGNS, 'line');
  path.setAttribute('x1', sx); path.setAttribute('y1', sy);
  path.setAttribute('x2', sx); path.setAttribute('y2', sy);
  path.setAttribute('stroke', '#ffd166'); path.setAttribute('stroke-width', '2.5');
  path.setAttribute('marker-end', 'url(#arrowhead)');
  if (dashed) path.setAttribute('stroke-dasharray', '6 5');
  layer.appendChild(path);
  return new Promise(resolve => {
    path.style.transition = `x2 ${duration}ms ease, y2 ${duration}ms ease`;
    requestAnimationFrame(() => { path.setAttribute('x2', ex); path.setAttribute('y2', ey); });
    setTimeout(resolve, duration);
  });
}

const MASTERY_GOAL = 3;
const MASTERY_KEY = 'tacticsBoardMastery_v1';

function loadMastery() {
  try {
    const raw = localStorage.getItem(MASTERY_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveMastery(mastery) {
  try {
    localStorage.setItem(MASTERY_KEY, JSON.stringify(mastery));
  } catch (e) {
    // storage unavailable (private browsing, etc.) — quiz still works, just won't persist
  }
}

function masteryCount(id) {
  return Math.min(state.mastery[id] || 0, MASTERY_GOAL);
}

function isExpert(id) {
  return masteryCount(id) >= MASTERY_GOAL;
}

function recordCorrectAnswer(id) {
  const before = state.mastery[id] || 0;
  const after = Math.min(before + 1, MASTERY_GOAL);
  state.mastery[id] = after;
  saveMastery(state.mastery);
  return { before, after, justBecameExpert: before < MASTERY_GOAL && after >= MASTERY_GOAL };
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(concept, n) {
  const sameCat = CONCEPTS.filter(x => x.id !== concept.id && x.category === concept.category).map(x => x.name);
  const otherCat = CONCEPTS.filter(x => x.id !== concept.id && x.category !== concept.category).map(x => x.name);
  const pool = shuffle(sameCat).concat(shuffle(otherCat));
  return pool.slice(0, n);
}

const STOPWORDS = ['the', 'a', 'an', 'call', 'shout', 'concept', 'principle'];

function normalizeWords(str) {
  return str
    .toLowerCase()
    .replace(/['"]/g, '')
    .split(/[^a-z0-9]+/)
    .filter(w => w && !STOPWORDS.includes(w));
}

function normalizeAnswer(str) {
  return normalizeWords(str).join('');
}

function stemWord(w) {
  if (w.length > 6 && w.endsWith('tion')) return w.slice(0, -4);
  if (w.length > 5 && w.endsWith('ing')) return w.slice(0, -3);
  if (w.length > 5 && w.endsWith('ers')) return w.slice(0, -3);
  if (w.length > 4 && w.endsWith('ly')) return w.slice(0, -2);
  if (w.length > 4 && w.endsWith('er')) return w.slice(0, -2);
  if (w.length > 4 && w.endsWith('es')) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
  return w;
}

function stemAnswer(str) {
  return normalizeWords(str).map(stemWord).join('');
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1]
        ? dp[i - 1][j - 1]
        : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

function closeEnough(a, b) {
  if (a === b) return true;
  if (!a || !b) return false;
  const threshold = b.length <= 2 ? 0 : b.length <= 5 ? 1 : b.length <= 9 ? 2 : 3;
  return levenshtein(a, b) <= threshold;
}

function isAnswerCorrect(typed, concept) {
  const t = normalizeAnswer(typed);
  if (!t) return false;
  const tStem = stemAnswer(typed);
  const candidates = [concept.name, ...(concept.altAnswers || [])];
  return candidates.some(candidate => {
    const c = normalizeAnswer(candidate);
    const cStem = stemAnswer(candidate);
    return closeEnough(t, c) || closeEnough(tStem, cStem);
  });
}

function renderQuiz() {
  const conceptIndex = state.quizOrder[state.quizPos];
  const c = CONCEPTS[conceptIndex];
  const mediaHtml = c.noAnimation
    ? `<div class="explain-note" style="margin-top:0;">${c.scenario}</div>`
    : `${pitchSvg('svgB', c.pitchLabels)}
       <div class="controls-row"><button id="replayBtn">↻ Replay animation</button></div>`;

  app.innerHTML = `
    <div class="board-card">
      <div class="tag-row"><div class="concept-tag display">Question ${state.quizPos + 1} of ${state.quizOrder.length}</div></div>
      ${mediaHtml}
      <div class="quiz-block">
        <p class="quiz-question">${c.question}</p>
        <div id="answerArea"></div>
        <div id="feedbackWrap"></div>
      </div>
    </div>`;
  if (!c.noAnimation) {
    const layer = document.getElementById('svgB-layer');
    document.getElementById('replayBtn').onclick = () => ANIMATIONS[c.id](layer);
    ANIMATIONS[c.id](layer);
  }

  const answerArea = document.getElementById('answerArea');

  function finishAnswer(isCorrect) {
    state.results[conceptIndex] = isCorrect;
    if (isCorrect) state.score += 1;

    let masteryLine = '';
    if (isCorrect) {
      const { after, justBecameExpert } = recordCorrectAnswer(c.id);
      if (justBecameExpert) {
        state.newlyMastered.push(c.name);
        masteryLine = `<div class="mastery-line expert">🏆 Expert! You've now gotten "${c.name}" right ${MASTERY_GOAL} times.</div>`;
      } else {
        masteryLine = `<div class="mastery-line">Correct ${after} of ${MASTERY_GOAL} times toward Expert on "${c.name}".</div>`;
      }
    }

    updateScoreboard();
    renderDots();
    const fbWrap = document.getElementById('feedbackWrap');
    fbWrap.innerHTML = `<div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
      <b>${isCorrect ? '✓' : '✗'} ${c.name}.</b> ${isCorrect ? c.feedbackCorrect : c.feedbackWrong}
    </div>
    ${masteryLine}
    <div class="controls-row">
      <button class="primary" id="nextQBtn">${state.quizPos === state.quizOrder.length - 1 ? 'See results →' : 'Next question →'}</button>
    </div>`;
    document.getElementById('nextQBtn').onclick = () => {
      if (state.quizPos === state.quizOrder.length - 1) { state.phase = 'summary'; }
      else { state.quizPos += 1; }
      render();
    };
  }

  if (state.answerMode === 'typed') {
    answerArea.innerHTML = `
      <input type="text" class="answer-input" id="typedInput" placeholder="Type the tactical term…" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <div class="controls-row"><button class="primary" id="submitBtn">Submit answer</button></div>`;
    const input = document.getElementById('typedInput');
    const submitBtn = document.getElementById('submitBtn');
    input.focus();
    function submit() {
      const typed = input.value.trim();
      if (!typed) return;
      input.disabled = true;
      submitBtn.disabled = true;
      const isCorrect = isAnswerCorrect(typed, c);
      input.classList.add(isCorrect ? 'correct' : 'wrong');
      finishAnswer(isCorrect);
    }
    submitBtn.onclick = submit;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  } else {
    const distractors = pickDistractors(c, 5);
    const shuffledOptions = shuffle([c.name, ...distractors]);
    const optionsWrap = document.createElement('div');
    optionsWrap.className = 'options';
    optionsWrap.id = 'optionsWrap';
    answerArea.appendChild(optionsWrap);
    shuffledOptions.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="opt-num">${i + 1}</span><span>${opt}</span>`;
      btn.onclick = () => answer(i);
      optionsWrap.appendChild(btn);
    });
    function answer(i) {
      const buttons = optionsWrap.querySelectorAll('.opt-btn');
      buttons.forEach(b => b.classList.add('disabled'));
      const isCorrect = shuffledOptions[i] === c.name;
      const correctIdx = shuffledOptions.findIndex(o => o === c.name);
      buttons[correctIdx].classList.add('correct');
      if (!isCorrect) buttons[i].classList.add('wrong');
      finishAnswer(isCorrect);
    }
  }
}

function renderSummary() {
  const total = state.quizOrder.length;
  const missed = CONCEPTS.filter((c, i) => state.results[i] === false);
  const masteredCount = CONCEPTS.filter(c => isExpert(c.id)).length;
  let tier = 'Keep studying the tactics board.';
  if (state.score === total) tier = 'Perfect score — you know your tactics.';
  else if (state.score >= total * 0.75) tier = 'Strong grasp of the concepts.';
  else if (state.score >= total * 0.5) tier = 'Solid start — a few gaps to close.';
  app.innerHTML = `
    <div class="board-card summary-card">
      <div class="concept-tag display">Final result</div>
      <div class="summary-score display mono">${state.score}/${total}</div>

      <p style="font-size:13px; color:#a8c5b4; margin: 12px 0 0;">Overall: <b style="color:#ffd166">${masteredCount} of ${CONCEPTS.length}</b> concepts mastered (${MASTERY_GOAL} correct answers each).</p>
      ${missed.length ? `

        </div>` : ''}
      <div class="controls-row" style="justify-content:center; margin-top:8px;">
        <button class="display" id="reviewBtn">Review terms first</button>
        <button class="primary display" id="restartBtn">Take quiz again</button>
      </div>
    </div>`;
  document.getElementById('reviewBtn').onclick = () => {
    state = { phase: 'studyMenu', studyIndex: 0, quizOrder: [], quizPos: 0, score: 0, results: [], answerMode: state.answerMode, mastery: state.mastery, newlyMastered: [] };
    render();
  };
  document.getElementById('restartBtn').onclick = () => {
    state = { phase: 'intro', studyIndex: 0, quizOrder: [], quizPos: 0, score: 0, results: [], answerMode: state.answerMode, mastery: state.mastery, newlyMastered: [] };
    startQuiz();
  };
}

function render() {
  updateScoreboard();
  renderDots();
  if (state.phase === 'intro') renderIntro();
  else if (state.phase === 'studyMenu') renderStudyMenu();
  else if (state.phase === 'study') renderStudy();
  else if (state.phase === 'quiz') renderQuiz();
  else if (state.phase === 'summary') renderSummary();
}

render();
</script>
</body>
</html>
